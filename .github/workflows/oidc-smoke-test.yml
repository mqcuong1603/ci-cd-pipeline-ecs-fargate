name: OIDC Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::080577529751:role/github-actions-ci-role
          aws-region: ap-southeast-1

      - name: Show AWS identity
        run: aws sts get-caller-identity