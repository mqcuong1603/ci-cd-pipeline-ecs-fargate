name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  #Test
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: docker build -t app:ci .

  #build-push to ecr
  build-push:
    needs: test
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::080577529751:role/github-actions-ci-role
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg APP_VERSION=${{ github.run_number }} \
            -t ${{ steps.login-ecr.outputs.registry }}/ci-cd-pipeline-ecs-fargate:${{ github.sha }} \
            .

      - name: Push Docker image
        run: docker push ${{ steps.login-ecr.outputs.registry }}/ci-cd-pipeline-ecs-fargate:${{ github.sha }}

  #deploy
  deploy:
    needs: build-push
    if: github.event_name == 'push'
    environment: production

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::080577529751:role/github-actions-deploy-role
          aws-region: ap-southeast-1

      - name: Render task definition
        env:
          IMAGE_URI: 080577529751.dkr.ecr.ap-southeast-1.amazonaws.com/ci-cd-pipeline-ecs-fargate:${{ github.sha }}
        run: |
          echo "Deploying image: $IMAGE_URI"

          jq --arg image "$IMAGE_URI" \
            '.containerDefinitions[0].image = $image' \
            task-definition.json > task-definition.rendered.json

          jq -r '.containerDefinitions[0].image' task-definition.rendered.json

      - name: Register task definition and update service
        run: |
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered: $TASK_DEFINITION_ARN"

          aws ecs update-service \
            --cluster fargate-cluster \
            --service fargate-service \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query 'service.[serviceName,taskDefinition]' \
            --output text

          aws ecs wait services-stable \
            --cluster fargate-cluster \
            --services fargate-service

          echo "ECS service is stable"

      - name: Verify deployed version
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          RESPONSE=$(curl --fail --silent --show-error http://fargate-alb-1382271171.ap-southeast-1.elb.amazonaws.com/version)

          echo "Response: $RESPONSE"

          ACTUAL_COMMIT=$(printf '%s' "$RESPONSE" | jq -r '.commit')

          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "Deployment verification failed"
            echo "Expected: $EXPECTED_COMMIT"
            echo "Actual:   $ACTUAL_COMMIT"
            exit 1
          fi

          echo "Deployment verified: $ACTUAL_COMMIT"
