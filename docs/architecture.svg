<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AWS ECS Fargate runtime architecture</title>
  <desc id="desc">A user reaches an internet-facing Application Load Balancer across two public subnets. Port 80 routes to production and port 8080 routes to staging. Both target groups forward to Fargate task private IPs on port 3000. Tasks pull the same SHA-tagged image from ECR and send logs to CloudWatch.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .section { font-size: 17px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #475569; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="55" y="52" class="title">AWS ECS Fargate Runtime Architecture</text>
  <text x="55" y="80" class="subtitle">ap-southeast-1 | one shared ALB | isolated staging and production services</text>

  <!-- Client -->
  <rect x="35" y="315" width="150" height="105" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="356" text-anchor="middle" class="label">User / curl</text>
  <text x="110" y="383" text-anchor="middle" class="body">Public internet</text>
  <text x="110" y="405" text-anchor="middle" class="small">ALB DNS name</text>

  <!-- AWS boundary -->
  <rect x="270" y="105" width="1280" height="735" rx="20" fill="#fffaf2" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="270" y="105" width="1280" height="48" rx="20" fill="#ffedd5"/>
  <rect x="270" y="133" width="1280" height="20" fill="#ffedd5"/>
  <text x="295" y="137" class="section">AWS Cloud - Asia Pacific (Singapore)</text>

  <!-- VPC -->
  <rect x="330" y="180" width="900" height="610" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="355" y="213" class="section">VPC 10.0.0.0/16</text>

  <!-- IGW -->
  <rect x="292" y="330" width="115" height="76" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="349" y="359" text-anchor="middle" class="label">Internet</text>
  <text x="349" y="379" text-anchor="middle" class="label">Gateway</text>
  <text x="349" y="397" text-anchor="middle" class="small">0.0.0.0/0</text>

  <!-- Public subnets -->
  <rect x="435" y="235" width="345" height="190" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="455" y="264" class="label">Public subnet A</text>
  <text x="455" y="286" class="small">10.0.1.0/24 | ap-southeast-1a</text>
  <rect x="825" y="235" width="345" height="190" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="845" y="264" class="label">Public subnet B</text>
  <text x="845" y="286" class="small">10.0.2.0/24 | ap-southeast-1b</text>

  <!-- ALB logical box spanning both subnets -->
  <rect x="525" y="305" width="555" height="88" rx="15" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="802" y="336" text-anchor="middle" class="label">Internet-facing ALB: fargate-alb</text>
  <text x="802" y="359" text-anchor="middle" class="body">ALB nodes in both subnets</text>
  <text x="802" y="381" text-anchor="middle" class="small">SG_ALB allows inbound TCP 80 and 8080</text>

  <!-- Listeners and target groups -->
  <rect x="440" y="470" width="165" height="62" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="522" y="497" text-anchor="middle" class="label">Listener :80</text>
  <text x="522" y="518" text-anchor="middle" class="small">production</text>

  <rect x="655" y="460" width="245" height="82" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="777" y="490" text-anchor="middle" class="label">fargate-tg</text>
  <text x="777" y="513" text-anchor="middle" class="body">IP targets | HTTP :3000</text>
  <text x="777" y="532" text-anchor="middle" class="small">health check: /healthz</text>

  <rect x="440" y="575" width="165" height="62" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="522" y="602" text-anchor="middle" class="label">Listener :8080</text>
  <text x="522" y="623" text-anchor="middle" class="small">staging</text>

  <rect x="655" y="565" width="245" height="82" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="777" y="595" text-anchor="middle" class="label">fargate-tg-staging</text>
  <text x="777" y="618" text-anchor="middle" class="body">IP targets | HTTP :3000</text>
  <text x="777" y="637" text-anchor="middle" class="small">health check: /healthz</text>

  <!-- Task placement -->
  <rect x="940" y="450" width="250" height="225" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1065" y="477" text-anchor="middle" class="small">awsvpc task ENIs</text>
  <text x="1065" y="495" text-anchor="middle" class="small">scheduled in either subnet</text>

  <rect x="965" y="515" width="200" height="64" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1065" y="541" text-anchor="middle" class="label">fargate-service</text>
  <text x="1065" y="563" text-anchor="middle" class="small">1 task | Node app :3000</text>

  <rect x="965" y="595" width="200" height="64" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1065" y="621" text-anchor="middle" class="label">fargate-service-staging</text>
  <text x="1065" y="643" text-anchor="middle" class="small">1 task | Node app :3000</text>

  <!-- AWS services outside VPC -->
  <rect x="1290" y="235" width="210" height="102" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <text x="1395" y="270" text-anchor="middle" class="label">Amazon ECR</text>
  <text x="1395" y="295" text-anchor="middle" class="body">One SHA-tagged image</text>
  <text x="1395" y="317" text-anchor="middle" class="small">used by both environments</text>

  <rect x="1290" y="385" width="210" height="94" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
  <text x="1395" y="420" text-anchor="middle" class="label">CloudWatch Logs</text>
  <text x="1395" y="446" text-anchor="middle" class="body">/ecs/fargate-app</text>
  <text x="1395" y="466" text-anchor="middle" class="small">7-day retention</text>

  <rect x="1290" y="525" width="210" height="115" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1395" y="556" text-anchor="middle" class="label">Task networking</text>
  <text x="1395" y="581" text-anchor="middle" class="body">Private IP: ALB traffic</text>
  <text x="1395" y="604" text-anchor="middle" class="body">Public IP: outbound only</text>
  <text x="1395" y="627" text-anchor="middle" class="small">No NAT Gateway</text>

  <!-- Edges -->
  <path d="M185 367 H292" class="edge"/>
  <text x="238" y="352" text-anchor="middle" class="small">HTTP</text>
  <path d="M407 367 H525" class="edge"/>
  <path d="M665 393 V435 H522 V470" class="edge"/>
  <path d="M940 393 V435 H522 V575" class="edge-blue"/>
  <path d="M605 501 H655" class="edge"/>
  <path d="M605 606 H655" class="edge-blue"/>
  <path d="M900 501 H930 V547 H965" class="edge"/>
  <path d="M900 606 H965" class="edge-blue"/>
  <text x="927" y="490" text-anchor="middle" class="small">private IP</text>
  <text x="932" y="594" text-anchor="middle" class="small">private IP</text>

  <path d="M1165 547 H1245 V286 H1290" class="edge-dashed"/>
  <path d="M1165 627 H1265 V306 H1290" class="edge-dashed"/>
  <text x="1247" y="270" class="small">pull image</text>
  <path d="M1165 557 H1225 V420 H1290" class="edge-dashed"/>
  <path d="M1165 637 H1250 V450 H1290" class="edge-dashed"/>

  <!-- Security note -->
  <rect x="435" y="705" width="755" height="58" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="812" y="730" text-anchor="middle" class="label">SG_TASK: allow TCP 3000 only from SG_ALB</text>
  <text x="812" y="751" text-anchor="middle" class="small">Direct laptop -&gt; task-public-IP:3000 is blocked; ALB -&gt; task-private-IP:3000 is allowed.</text>

  <!-- Legend -->
  <line x1="1290" y1="715" x2="1345" y2="715" class="edge"/>
  <text x="1360" y="720" class="small">request traffic</text>
  <line x1="1290" y1="752" x2="1345" y2="752" class="edge-dashed"/>
  <text x="1360" y="757" class="small">AWS service access</text>
</svg>
